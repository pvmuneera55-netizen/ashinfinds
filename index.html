<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7b8e11">
<title>Ashin Finds</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--ink:#161616;--mut:#5e6356;--bar:#f1f2ea;--blue:#1a56f0;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:12px}
body{margin:0;background:#e9ebdf;color:var(--ink);font-family:Inter,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;min-height:100vh;background:#fafaf6;padding-bottom:128px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hero{background:linear-gradient(180deg,#7b8e11 0%,#95a621 28%,#c3ca4e 62%,#e3e48a 100%);border-radius:0 0 30px 30px;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 22px;margin-bottom:20px}
.hb{display:flex;align-items:center;gap:12px;color:#fff;margin-bottom:18px}
.av{width:50px;height:50px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid rgba(255,255,255,.85)}
.hb h1{margin:0;font-size:1.4rem;font-weight:800;line-height:1.15}
.hb p{margin:2px 0 0;font-size:.88rem;opacity:.9}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.35)}
.tabs::-webkit-scrollbar,.prow::-webkit-scrollbar{display:none}
.tab{flex:none;width:86px;display:flex;flex-direction:column;align-items:center;gap:8px;padding-bottom:9px;border-bottom:3px solid transparent;margin-bottom:-1px;color:#fff;font-size:.82rem;line-height:1.2}
.tab img{width:76px;height:54px;object-fit:cover;object-position:50% 35%;border-radius:15px;background:rgba(255,255,255,.35);display:block}
.tab.on{font-weight:700;border-bottom-color:#fff}
.prow{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:18px -16px 0;padding:0 16px 2px}
.pc{flex:none;width:150px;display:block;text-align:center}
.pc img{width:100%;aspect-ratio:1/1.1;object-fit:cover;object-position:50% 35%;border-radius:22px;display:block;background:rgba(255,255,255,.5)}
.pn{display:block;margin-top:10px;font-size:.97rem;line-height:1.25}
.pb{display:block;margin-top:3px;font-weight:800;font-size:.9rem}
.sec{margin:0 14px 18px;padding:18px 16px 20px;border-radius:30px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sh h2{margin:0;font-size:1.25rem;font-weight:800}
.more{flex:none;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.7);font-weight:600;font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 12px}
.grid .pc{width:auto}
.pg{padding:calc(18px + env(safe-area-inset-top,0px)) 14px 0}
.pg>h2{margin:0 2px 14px;font-size:1.6rem;font-weight:800}
.back{display:inline-block;margin:0 2px 10px;font-weight:600;color:var(--mut)}
.ct{display:block;border-radius:26px;padding:12px 12px 16px;text-align:center}
.ct img{width:100%;aspect-ratio:1/.85;object-fit:cover;object-position:50% 35%;border-radius:18px;display:block;background:rgba(255,255,255,.5)}
.ct b{display:block;margin-top:10px;font-size:1.02rem;font-weight:800}
.ct small{display:block;margin-top:2px;color:#444;font-size:.85rem}
.sw{position:relative;margin-bottom:18px}
.sw svg{position:absolute;left:18px;top:50%;width:20px;height:20px;transform:translateY(-50%);stroke:var(--mut);fill:none;stroke-width:2;stroke-linecap:round}
.si{display:block;width:100%;border:1px solid #d7dac8;border-radius:999px;background:#fff;color:var(--ink);font:500 1rem Inter,system-ui,sans-serif;padding:16px 20px 16px 48px}
.cnt{margin:0 2px 14px;color:var(--mut);font-size:.9rem}
.empty{text-align:center;color:var(--mut);padding:36px 0}
.bar{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(492px,calc(100% - 28px));display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px;border-radius:32px;background:var(--bar);border:1px solid rgba(0,0,0,.06);box-shadow:0 10px 30px -8px rgba(30,40,10,.35)}
.bar a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px 8px;border-radius:26px;font-size:.78rem;font-weight:500}
.bar svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bar a.on{background:#dfe0d4;color:var(--blue);font-weight:700}
.bar a.on svg{fill:currentColor;fill-opacity:.9}
</style></head><body><main></main>

  view.innerHTML=`<section class="hero"><div class="hb"><img class="av" src="${D.logo}" alt=""><div><h1>Ashin Finds</h1><p>Handpicked finds, one tap away</p></div></div>
  <div class="tabs" id="tabs" role="tablist">${SECS.filter(x=>x.id!=='more').map(x=>`<button class="tab${x.id===tabId?' on':''}" data-id="${x.id}" role="tab"><img src="${cover(x.id)}" alt="">${x.n}</button>`).join('')}</div>
  <div class="prow" id="prow">${s.p.map(pc).join('')}</div></section>`+
  SECS.filter(x=>x.id!=='top').map(x=>`<section class="sec" style="${bg(x.id)}"><div class="sh"><h2>${x.n}</h2><a class="more" href="#cat-${x.id}">See all</a></div><div class="prow" style="margin-top:0">${x.p.map(pc).join('')}</div></section>`).join('');
}
function cats(){
  view.innerHTML=`<div class="pg"><h2>Categories</h2><div class="grid">${SECS.map(x=>`<a class="ct" href="#cat-${x.id}" style="${bg(x.id)}"><img src="${cover(x.id)}" alt=""><b>${x.n}</b><small>${x.p.length} items</small></a>`).join('')}</div></div>`;
}
function cat(id){
  const s=SECS.find(x=>x.id===id);
  if(!s){go('home');return}
  view.innerHTML=`<div class="pg"><a class="back" href="#categories">&lsaquo; Categories</a><section class="sec" style="margin:0;${bg(id)}"><div class="sh"><h2>${s.n}</h2><span>${s.p.length} items</span></div><div class="grid">${s.p.map(pc).join('')}</div></section></div>`;
}
function search(){
  view.innerHTML=`<div class="pg"><div class="sw"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input class="si" id="q" type="search" placeholder="Search products" aria-label="Search products" autocomplete="off"></div><div id="sres"></div></div>`;
  const q=$('#q'),r=$('#sres');
  const go=()=>{const t=q.value.trim().toLowerCase();const ks=t?ALL.filter(k=>(D.P[k].n+' '+catOf[k]).toLowerCase().includes(t)):ALL;
    r.innerHTML=ks.length?`<p class="cnt">${t?ks.length+' found':'All products ('+ks.length+')'}</p><div class="grid">${ks.map(pc).join('')}</div>`:'<p class="empty">No products found</p>'};
  q.addEventListener('input',go);go();q.focus({preventScroll:true});
}
function route(){
  const h=cur;let r='home';
  if(h==='categories'||h.startsWith('cat-'))r='cats';else if(h==='search')r='search';
  document.querySelectorAll('.bar a').forEach(a=>{const on=a.dataset.r===r;a.classList.toggle('on',on);if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  if(h==='categories')cats();else if(h.startsWith('cat-'))cat(h.slice(4));else if(h==='search')search();else home();
  window.scrollTo(0,0);
}
view.addEventListener('click',e=>{
  const t=e.target.closest('.tab');if(!t)return;
  tabId=t.dataset.id;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  const s=SECS.find(x=>x.id===tabId);const pr=$('#prow');pr.innerHTML=s.p.map(pc).join('');pr.scrollLeft=0;
});
function go(h){cur=h;try{history.replaceState(null,'','#'+h)}catch(e){}route()}
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#"]');
  if(!a||e.metaKey||e.ctrlKey)return;
  e.preventDefault();go(a.getAttribute('href').slice(1));
});
addEventListener('hashchange',()=>{cur=location.hash.slice(1);route()});
route();

</script></body></html>
